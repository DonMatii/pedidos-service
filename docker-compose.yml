# Kafka local (KRaft) para desarrollo - topic: pedidos (RF-08)
# Puerto 9092 movido a 19092 porque Windows reserva el rango 9081-9180
# (exclusiones de Hyper-V/WSL) y Kafka no puede bindear ahí.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pasteleria-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos audiencias: PLAINTEXT para los servicios del host (localhost:19092)
      # y INTERNAL para los contenedores del compose (kafka-ui). El advertised
      # de cada listener apunta al nombre correcto segun quien se conecta.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:29092,CONTROLLER://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/tmp

  # Consola web de administración del broker: crear/listar/borrar tópicos y
  # ver configuraciones sin escribir código propio. Decisión de arquitectura
  # documentada en el informe: herramienta estándar de la comunidad en vez de
  # un microservicio administrador a medida (regla de oro: si no mejora ventas,
  # retención ni el tiempo de Cathi, se posterga).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pasteleria-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pasteleria
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  kafka-data:
