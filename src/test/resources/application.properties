# Tests herméticos: usan H2 en memoria, no requieren MySQL levantado
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Kafka: este archivo REEMPLAZA al de src/main, así que se repiten las propiedades.
# El test de integración sobrescribe bootstrap-servers con el broker embebido.
spring.kafka.bootstrap-servers=localhost:19092
app.kafka.topic=pedidos
app.kafka.topic.estados=pedidos-estados
app.kafka.topic.solicitudes=solicitudes

# El stream de Kinesis se desactiva en las pruebas (unitarias lo simulan)
app.kinesis.habilitado=false

# API key de prueba: los endpoints administrativos exigen header X-Api-Key
app.admin-api-key=test-admin-key

# Seguridad JWT en tests: decoder offline con una clave pública SOLO de pruebas
# (generada para la suite; sin valor en producción). Así nunca se habla con el
# JWKS de Google desde los tests y se pueden firmar tokens reales con la clave
# privada correspondiente (constante en AutenticacionJwtIntegrationTest).
