spring.application.name=pedidos-service
server.port=8082

# Conexión a la Base de Datos (variables de entorno con default local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria_my_dreams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka local (broker en docker, topic creado por docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:19092
app.kafka.topic=pedidos
# Topic PROPIO para los cambios de estado que la administradora aplica desde el panel
app.kafka.topic.estados=pedidos-estados
# Topic de las solicitudes de pedido de la Versión 1 (S2): no es una venta, es el
# formulario con el que el usuario V1 pide sus delicias y recibe correo de aviso
app.kafka.topic.solicitudes=solicitudes

# Stream de eventos de negocio (Entrega 3): LocalStack en local, Kinesis real
# en el lab. Con KINESIS_ENDPOINT vacío se usa AWS con sus credenciales.
app.kinesis.habilitado=true
app.kinesis.endpoint=${KINESIS_ENDPOINT:http://localhost:4566}
app.kinesis.region=${KINESIS_REGION:us-east-1}
app.kinesis.stream=eventos-negocio
app.kinesis.auto-crear-stream=true

# Catálogo: la Delicia del Día se consulta a catalogo-service (descuento -10%, fail-open)
app.catalogo.base-url=${CATALOGO_URL:http://localhost:8080}

# Seguridad: validación real del JWT de Google (firma, emisor y audiencia).
# app.seguridad.jwt.audience es el client id de Google (GOOGLE_CLIENT_ID): sin
# configurarlo los endpoints de usuario responden 401 (fail-closed, nunca abiertos).
# El origen de claves por defecto es el JWKS de Google
# (https://www.googleapis.com/oauth2/v3/certs); app.seguridad.jwt.jwk-set-uri solo
# es necesaria para apuntar a otro origen.
app.seguridad.jwt.audience=${GOOGLE_CLIENT_ID:}
